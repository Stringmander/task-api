info:
  name: create-project
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/projects"
  body:
    type: json
    data: |-
      {
        "name": "Portfolio Project",
        "description": "Node.js task API for the career pivot"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("projectId", res.body.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
