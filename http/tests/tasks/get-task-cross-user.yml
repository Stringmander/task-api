info:
  name: get-task-cross-user
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/tasks/:id"
  params:
    - name: id
      value: "{{taskId}}"
      type: path
  auth:
    type: bearer
    token: "{{secondUserAccessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
