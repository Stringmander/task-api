info:
  name: list-tasks-garbage-token
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/projects/:id/tasks"
  params:
    - name: id
      value: "{{projectId}}"
      type: path
  auth:
    type: bearer
    token: garbagetoken

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
