info:
  name: list-tasks-no-token
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/projects/:id/tasks"
  params:
    - name: id
      value: "{{projectId}}"
      type: path

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
