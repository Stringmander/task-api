info:
  name: get-project-cross-user
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/projects/:id"
  params:
    - name: id
      value: "{{projectId}}"
      type: path
  auth:
    type: bearer
    token: "{{secondUserAccessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
