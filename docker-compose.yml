services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskapi
      POSTGRES_PASSWORD: taskapi
      POSTGRES_DB: taskapi
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taskapi -d taskapi']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides .env's own DATABASE_URL: from inside this container "db"
      # is the other service's hostname on the compose network, not
      # localhost - the port itself (5432) is unchanged.
      DATABASE_URL: postgres://taskapi:taskapi@db:5432/taskapi
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    # No healthcheck block here - the Dockerfile's own HEALTHCHECK
    # instruction already covers this service; compose picks it up from
    # the image without needing it redeclared.

volumes:
  db-data:
