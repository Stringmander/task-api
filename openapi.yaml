openapi: 3.0.0
info:
  title: task-api
  description: >-
    Task management REST API. Users own projects; projects contain tasks; access
    is scoped to the authenticated user at every layer.
  version: 0.1.0
components:
  schemas:
    def-0:
      description: A project
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
      title: projectResponseSchema
    def-1:
      description: A task
      type: object
      properties:
        id:
          type: integer
        projectId:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
        priority:
          type: string
        dueDate:
          type: string
          nullable: true
        position:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string
      title: taskResponseSchema
paths:
  /health:
    get:
      responses:
        '200':
          description: Liveness status
          content:
            application/json:
              schema:
                description: Liveness status
                type: object
                properties:
                  status:
                    type: string
  /auth/register:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - displayName
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 100
      responses:
        '201':
          description: A user
          content:
            application/json:
              schema:
                description: A user
                type: object
                properties:
                  id:
                    type: integer
                  email:
                    type: string
                  displayName:
                    type: string
                  createdAt:
                    type: string
  /auth/login:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
      responses:
        '200':
          description: An access/refresh token pair
          content:
            application/json:
              schema:
                description: An access/refresh token pair
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
  /auth/refresh:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              additionalProperties: false
              properties:
                refreshToken:
                  type: string
                  pattern: ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$
                  maxLength: 2048
      responses:
        '200':
          description: An access/refresh token pair
          content:
            application/json:
              schema:
                description: An access/refresh token pair
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
  /projects:
    get:
      responses:
        '200':
          description: A list of projects
          content:
            application/json:
              schema:
                description: A list of projects
                type: array
                items:
                  $ref: '#/components/schemas/def-0'
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                description:
                  type: string
                  nullable: true
      responses:
        '201':
          description: A project
          content:
            application/json:
              schema:
                description: A project
                type: object
                properties:
                  id:
                    type: integer
                  userId:
                    type: integer
                  name:
                    type: string
                  description:
                    type: string
                    nullable: true
                  createdAt:
                    type: string
                  updatedAt:
                    type: string
  /projects/{id}:
    get:
      parameters:
        - schema:
            type: string
            pattern: ^[0-9]{1,15}$
          in: path
          name: id
          required: true
      responses:
        '200':
          description: A project
          content:
            application/json:
              schema:
                description: A project
                type: object
                properties:
                  id:
                    type: integer
                  userId:
                    type: integer
                  name:
                    type: string
                  description:
                    type: string
                    nullable: true
                  createdAt:
                    type: string
                  updatedAt:
                    type: string
    patch:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                description:
                  type: string
                  nullable: true
      parameters:
        - schema:
            type: string
            pattern: ^[0-9]{1,15}$
          in: path
          name: id
          required: true
      responses:
        '200':
          description: A project
          content:
            application/json:
              schema:
                description: A project
                type: object
                properties:
                  id:
                    type: integer
                  userId:
                    type: integer
                  name:
                    type: string
                  description:
                    type: string
                    nullable: true
                  createdAt:
                    type: string
                  updatedAt:
                    type: string
    delete:
      parameters:
        - schema:
            type: string
            pattern: ^[0-9]{1,15}$
          in: path
          name: id
          required: true
      responses:
        '204':
          description: No content
  /projects/{id}/tasks:
    get:
      parameters:
        - schema:
            type: string
            pattern: ^[0-9]{1,15}$
          in: path
          name: id
          required: true
      responses:
        '200':
          description: A list of tasks
          content:
            application/json:
              schema:
                description: A list of tasks
                type: array
                items:
                  $ref: '#/components/schemas/def-1'
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              additionalProperties: false
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 100
                description:
                  type: string
                  nullable: true
                status:
                  type: string
                  enum:
                    - todo
                    - in_progress
                    - done
                priority:
                  type: string
                  enum:
                    - low
                    - medium
                    - high
                dueDate:
                  type: string
                  format: date
                  nullable: true
                position:
                  type: integer
      parameters:
        - schema:
            type: string
            pattern: ^[0-9]{1,15}$
          in: path
          name: id
          required: true
      responses:
        '201':
          description: A task
          content:
            application/json:
              schema:
                description: A task
                type: object
                properties:
                  id:
                    type: integer
                  projectId:
                    type: integer
                  title:
                    type: string
                  description:
                    type: string
                    nullable: true
                  status:
                    type: string
                  priority:
                    type: string
                  dueDate:
                    type: string
                    nullable: true
                  position:
                    type: integer
                  createdAt:
                    type: string
                  updatedAt:
                    type: string
  /tasks/{id}:
    get:
      parameters:
        - schema:
            type: string
            pattern: ^[0-9]{1,15}$
          in: path
          name: id
          required: true
      responses:
        '200':
          description: A task
          content:
            application/json:
              schema:
                description: A task
                type: object
                properties:
                  id:
                    type: integer
                  projectId:
                    type: integer
                  title:
                    type: string
                  description:
                    type: string
                    nullable: true
                  status:
                    type: string
                  priority:
                    type: string
                  dueDate:
                    type: string
                    nullable: true
                  position:
                    type: integer
                  createdAt:
                    type: string
                  updatedAt:
                    type: string
    patch:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 100
                description:
                  type: string
                  nullable: true
                status:
                  type: string
                  enum:
                    - todo
                    - in_progress
                    - done
                priority:
                  type: string
                  enum:
                    - low
                    - medium
                    - high
                dueDate:
                  type: string
                  format: date
                  nullable: true
                position:
                  type: integer
      parameters:
        - schema:
            type: string
            pattern: ^[0-9]{1,15}$
          in: path
          name: id
          required: true
      responses:
        '200':
          description: A task
          content:
            application/json:
              schema:
                description: A task
                type: object
                properties:
                  id:
                    type: integer
                  projectId:
                    type: integer
                  title:
                    type: string
                  description:
                    type: string
                    nullable: true
                  status:
                    type: string
                  priority:
                    type: string
                  dueDate:
                    type: string
                    nullable: true
                  position:
                    type: integer
                  createdAt:
                    type: string
                  updatedAt:
                    type: string
    delete:
      parameters:
        - schema:
            type: string
            pattern: ^[0-9]{1,15}$
          in: path
          name: id
          required: true
      responses:
        '204':
          description: No content
